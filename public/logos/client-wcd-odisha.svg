<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <!-- Women and Child Development Department, Government of Odisha -->
  <rect width="340" height="340" fill="#FFFFFF"/>

  <!-- Outer deep navy circle -->
  <circle cx="170" cy="170" r="150" fill="#0C4582"/>

  <!-- Inner white circular cutout boundary -->
  <circle cx="170" cy="170" r="100" fill="#FFFFFF"/>

  <!-- Department Arch Text along circular path -->
  <defs>
    <!-- Top Arc for WOMEN AND CHILD DEVELOPMENT DEPARTMENT -->
    <path id="wcdTopArc" d="M 45 170 A 125 125 0 0 1 295 170" fill="none"/>
    <!-- Bottom Arc for GOVERNMENT OF ODISHA -->
    <path id="wcdBottomArc" d="M 50 170 A 120 120 0 0 0 290 170" fill="none"/>
  </defs>

  <text fill="#FFFFFF" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    <textPath href="#wcdTopArc" startOffset="50%" text-anchor="middle">
      WOMEN AND CHILD DEVELOPMENT DEPARTMENT
    </textPath>
  </text>

  <text fill="#FFFFFF" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="12" font-weight="800" letter-spacing="2">
    <textPath href="#wcdBottomArc" startOffset="50%" text-anchor="middle">
      GOVERNMENT OF ODISHA
    </textPath>
  </text>

  <!-- Center Mother and Child Silhouette in Navy Blue -->
  <g transform="translate(170, 170)">
    <!-- Ashoka Lion Pillar tiny emblem on top -->
    <g transform="translate(0, -68) scale(0.6)" fill="#0C4582">
      <rect x="-10" y="0" width="20" height="15" rx="1"/>
      <circle cx="0" cy="-6" r="5"/>
      <polygon points="-8,-4 0,-14 8,-4"/>
      <!-- Tiny ODISHA subtitle under emblem -->
      <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800">ODISHA</text>
    </g>

    <!-- Stylized Mother cradling infant baby icon inside inner circle -->
    <g transform="translate(0, 12)" fill="#0C4582">
      <!-- Mother's head -->
      <circle cx="10" cy="-28" r="11"/>
      <!-- Baby's head nestled against mother's chest -->
      <circle cx="-14" cy="-10" r="8"/>
      <!-- Flowing protective arms and silhouette -->
      <path d="M 12 -14 C 28 -8, 38 12, 28 32 C 18 46, -16 46, -30 28 C -38 14, -32 -6, -20 -18 C -14 -10, -10 -4, 0 4 C 12 12, 24 6, 20 -4 C 18 -10, 14 -14, 12 -14 Z"/>
      <!-- Swaddled infant curve -->
      <path d="M -16 0 C -6 6, -4 18, -12 24 C -20 28, -26 22, -26 12 C -26 4, -22 -2, -16 0 Z" fill="#FFFFFF"/>
      <path d="M -16 2 C -8 8, -6 16, -12 22" stroke="#0C4582" stroke-width="2.5" fill="none"/>
    </g>
  </g>
</svg>
