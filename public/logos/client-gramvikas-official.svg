<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 68" width="100%" height="100%" fill="none">
  <!-- Gram Vikas Official Identity: Emblem + Ultra-Bold High-Legibility Typography -->
  <g id="gramvikas-mark">
    <!-- Emblem: Rising Golden Sun & Nurturing Landscape -->
    <g transform="translate(4, 4)">
      <!-- Outer Radiant Warmth Ring -->
      <circle cx="30" cy="30" r="28" fill="#FFFBEB" stroke="#EA580C" stroke-width="2.5" />
      
      <!-- Golden Rising Sun -->
      <circle cx="30" cy="22" r="12" fill="#F59E0B" />
      <g stroke="#D97706" stroke-width="2" stroke-linecap="round">
        <line x1="30" y1="5" x2="30" y2="8" />
        <line x1="18" y1="11" x2="20" y2="13.5" />
        <line x1="42" y1="11" x2="40" y2="13.5" />
        <line x1="13" y1="22" x2="16" y2="22" />
        <line x1="47" y1="22" x2="44" y2="22" />
      </g>

      <!-- Supportive Green Hills / Community Landscape -->
      <path d="M 10 41 C 18 31 24 33 30 37 C 36 33 42 31 50 41 C 45 49 36 53 30 53 C 24 53 15 49 10 41 Z" fill="#166534" />
      <path d="M 17 43 C 23 36 28 38 30 40 C 32 38 37 36 43 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
      
      <!-- Flowing Clean Water Stream -->
      <path d="M 20 48 C 25 45 35 45 40 48" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Bold, High-Contrast Brand Typography -->
    <g transform="translate(72, 6)">
      <!-- Main Brand Name -->
      <text x="0" y="31" 
            fill="#0F172A" 
            font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="31" 
            font-weight="900" 
            letter-spacing="-0.6">
        Gram Vikas
      </text>
      
      <!-- Subtitle Tagline with enhanced tracking -->
      <text x="1" y="49" 
            fill="#334155" 
            font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
            font-size="11" 
            font-weight="800" 
            letter-spacing="2.2">
        RURAL DEVELOPMENT
      </text>
    </g>
  </g>
</svg>
