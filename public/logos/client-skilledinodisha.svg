        <line x1="20" y1="15" x2="20" y2="35" />
        <line x1="30" y1="15" x2="30" y2="35" />
        <line x1="40" y1="15" x2="40" y2="35" />
        <line x1="50" y1="15" x2="50" y2="35" />
        <line x1="60" y1="15" x2="60" y2="35" />
