    <!-- SIGNATURE 3D EXTRACTED TYPOGRAPHY -->
    
    <!-- 1. "Skilled in" signature script with continuous multicolor 3D extruded drop shadow -->
    <!-- Under-shadow extrusions matching exact colors of the brand reference:
         Left: Olive/Lime-Yellow -> Center: Warm Coral Pink -> Right: Violet/Periwinkle -> Far right: Sky Blue -->
    <g id="skilled-in-wordmark">
      <!-- 3D Extrusion Layers (offset along bottom-left to bottom-right vector) -->
      <!-- Green / Lime shadow under 'Sk' -->
      <text x="36" y="278" 
            font-family="'Caveat', 'Dancing Script', 'Brush Script MT', 'Pacifico', cursive, sans-serif" 
            font-size="126" 
            font-weight="700" 
            fill="#A7CE39" 
            transform="rotate(-8 230 240)">
        Skilled in
      </text>

      <!-- Peach / Coral shadow under 'ille' -->
      <text x="40" y="280" 
            font-family="'Caveat', 'Dancing Script', 'Brush Script MT', 'Pacifico', cursive, sans-serif" 
            font-size="126" 
            font-weight="700" 
            fill="#F6B278" 
            transform="rotate(-8 230 240)">
        Skilled in
      </text>

      <!-- Soft Lilac / Violet shadow under 'd in' -->
      <text x="44" y="282" 
            font-family="'Caveat', 'Dancing Script', 'Brush Script MT', 'Pacifico', cursive, sans-serif" 
            font-size="126" 
            font-weight="700" 
            fill="#D5A4DB" 
            transform="rotate(-8 230 240)">
        Skilled in
      </text>

      <!-- Soft Sky Blue outer shadow tip -->
      <text x="48" y="284" 
            font-family="'Caveat', 'Dancing Script', 'Brush Script MT', 'Pacifico', cursive, sans-serif" 
            font-size="126" 
            font-weight="700" 
            fill="#89C4E2" 
            transform="rotate(-8 230 240)">
        Skilled in
      </text>

      <!-- Crisp Solid Charcoal Foreground Cursive "Skilled in" -->
      <text x="42" y="274" 
            font-family="'Caveat', 'Dancing Script', 'Brush Script MT', 'Pacifico', cursive, sans-serif" 
            font-size="126" 
            font-weight="700" 
            fill="#222226" 
            stroke="#222226" 
            stroke-width="3" 
            stroke-linecap="round"
            stroke-linejoin="round"
            transform="rotate(-8 230 240)">
        Skilled in
      </text>
    </g>

    <!-- 2. "ODISHA" bold extruded sans-serif matching uploaded skilledinodisha.png -->
    <g id="odisha-wordmark" transform="rotate(-7 250 330)">
      <!-- Distinct multi-color 3D block projections:
           'O': Golden Yellow / Mustard (#ECC844)
           'D': Coral Pink (#EE8B8B)
           'I': Pastel Violet (#CDA1DE)
           'S': Pastel Lavender (#B8A2D9)
           'H': Light Sky Blue (#8ABFE7)
           'A': Sky Blue (#7EBAE3) -->

      <!-- 3D Extrusion Blocks -->
      <!-- O (Yellow Block) -->
      <text x="54" y="370" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="2" fill="#E8C33A">O</text>
      <!-- D (Coral Block) -->
      <text x="144" y="370" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="2" fill="#EC8585">D</text>
      <!-- I (Violet Block) -->
      <text x="238" y="370" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="2" fill="#C796D8">I</text>
      <!-- S (Lavender Block) -->
      <text x="274" y="370" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="2" fill="#B49CD5">S</text>
      <!-- H (Sky Blue Block) -->
      <text x="348" y="370" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="2" fill="#7DBAE3">H</text>
      <!-- A (Sky Blue Block) -->
      <text x="424" y="370" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="2" fill="#75B4DE">A</text>

      <!-- Foreground Bold Solid Black "ODISHA" Typography -->
      <text x="60" y="360" 
            font-family="'Arial Black', 'Impact', sans-serif" 
            font-size="108" 
            font-weight="900" 
            letter-spacing="2" 
            fill="#18181B" 
            stroke="#18181B" 
            stroke-width="2">
        ODISHA
      </text>
