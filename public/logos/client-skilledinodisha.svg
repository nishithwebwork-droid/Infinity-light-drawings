      <!-- Paint Roller (coral rose) -->
      <g transform="translate(255, 18)" stroke="#D85E4E" stroke-width="4" fill="none" stroke-linecap="round">
        <rect x="0" y="4" width="46" height="15" rx="3" />
        <path d="M46 11 L54 11 L54 28 L28 28 L28 42" />
        <rect x="25" y="42" width="6" height="18" rx="2" fill="#D85E4E" />
