<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 464 464" width="100%" height="100%">
  <!-- Transparent / Pure clean circular composition identical to uploaded skilledinodisha.png -->
  
  <g id="skilled-in-odisha-official">
    <!-- Circular collection of skill icon doodles forming the globe / circle exactly matching the uploaded PNG -->
    <g id="skill-icons-pattern">
      
      <!-- TOP REGION: Scissors, tools, screen, wrench, phone, plug, anchor, bolt -->
