<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <!-- Panchayati Raj & Drinking Water Department, Government of Odisha -->
  <rect width="340" height="340" fill="#FFFFFF"/>

  <!-- Outer deep navy circle with golden rope/cog pattern border -->
  <circle cx="170" cy="170" r="150" fill="#152B4D"/>
  <circle cx="170" cy="170" r="145" fill="none" stroke="#C5A059" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="170" cy="170" r="102" fill="none" stroke="#C5A059" stroke-width="2.5"/>

  <!-- Inner white circular disc -->
  <circle cx="170" cy="170" r="100" fill="#FFFFFF"/>

  <!-- Circular Arch Text -->
  <defs>
    <path id="prdwTopArc" d="M 45 170 A 125 125 0 0 1 295 170" fill="none"/>
    <path id="prdwBottomArc" d="M 45 170 A 125 125 0 0 0 295 170" fill="none"/>
  </defs>

  <text fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="14.5" font-weight="900" letter-spacing="3">
    <textPath href="#prdwTopArc" startOffset="50%" text-anchor="middle">
      GOVERNMENT OF ODISHA
    </textPath>
  </text>

  <text fill="#FFFFFF" font-family="'Arial', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">
    <textPath href="#prdwBottomArc" startOffset="50%" text-anchor="middle">
      PANCHAYATI RAJ &amp; DRINKING WATER DEPARTMENT
    </textPath>
  </text>

  <!-- Central Emblem: Sacred Banyan Tree inside blue ring with clean water ripples -->
  <g transform="translate(170, 170)">
    <!-- Inner cyan/blue ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#2980B9" stroke-width="5"/>
    
    <!-- Tree Trunk & Canopy (Green Banyan Tree of Panchayati Raj) -->
    <!-- Lush rounded green canopy foliage nodes -->
    <g fill="#27AE60">
      <circle cx="0" cy="-35" r="16"/>
      <circle cx="-20" cy="-30" r="14"/>
      <circle cx="20" cy="-30" r="14"/>
      <circle cx="-32" cy="-18" r="13"/>
      <circle cx="32" cy="-18" r="13"/>
      <circle cx="-16" cy="-14" r="15"/>
      <circle cx="16" cy="-14" r="15"/>
      <circle cx="0" cy="-18" r="16"/>
      <!-- Inner dark green leaves highlights -->
      <circle cx="-8" cy="-28" r="6" fill="#1E8449"/>
      <circle cx="8" cy="-28" r="6" fill="#1E8449"/>
    </g>

    <!-- Strong Banyan Trunk branching outward -->
    <path d="M -4 20 L -6 0 C -6 -10, -18 -18, -22 -22 M 4 20 L 6 0 C 6 -10, 18 -18, 22 -22 M 0 0 L 0 -22" stroke="#6E2C00" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <rect x="-8" y="16" width="16" height="6" rx="2" fill="#6E2C00"/>

    <!-- Water droplet & ripples beneath the tree -->
    <path d="M 0 28 C -4 34, -8 38, -8 44 C -8 50, -4 54, 0 54 C 4 54, 8 50, 8 44 C 8 38, 4 34, 0 28 Z" fill="#3498DB"/>
    <ellipse cx="0" cy="58" rx="24" ry="4" fill="none" stroke="#3498DB" stroke-width="2"/>
    <ellipse cx="0" cy="63" rx="36" ry="4" fill="none" stroke="#3498DB" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
