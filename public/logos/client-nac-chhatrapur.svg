    <circle cx="170" cy="170" r="98" fill="none" stroke="url(#nacGold)" stroke-width="3.5"/>
  </g>

  <!-- Circular Crisp Typography -->
  <!-- Top Text: NOTIFIED AREA COUNCIL -->
  <text fill="#FFFFFF" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800" letter-spacing="3.2" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">
    <textPath href="#nacTopArc" startOffset="50%" text-anchor="middle">
      NOTIFIED AREA COUNCIL
    </textPath>
  </text>

  <!-- Left & Right Gold Stars / Florets -->
  <g fill="url(#nacGold)" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">
    <polygon points="41,170 43.5,164 49,163.5 45,160 46,154 41,157 36,154 37,160 33,163.5 38.5,164" transform="translate(5, 0)"/>
    <polygon points="299,170 301.5,164 307,163.5 303,160 304,154 299,157 294,154 295,160 291,163.5 296.5,164" transform="translate(-5, 0)"/>
  </g>

  <!-- Bottom Text: CHHATRAPUR • GANJAM (Reads Upright) -->
  <text fill="#FCE77D" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="3.5" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">
    <textPath href="#nacBottomArc" startOffset="50%" text-anchor="middle">
      CHHATRAPUR • GANJAM
    </textPath>
  </text>

  <!-- Center Seal Scenery -->
  <g clip-path="url(#nacInnerCircleClip)">
    <!-- Sky Background -->
    <rect x="70" y="70" width="200" height="200" fill="url(#innerSkyGrad)"/>

    <!-- Radiating Golden Sunburst Rays from Horizon -->
    <g opacity="0.55">
      <polygon points="170,152 140,75 148,75" fill="url(#sunRaysGrad)"/>
      <polygon points="170,152 165,75 175,75" fill="url(#sunRaysGrad)"/>
      <polygon points="170,152 192,75 200,75" fill="url(#sunRaysGrad)"/>
      <polygon points="170,152 218,85 225,87" fill="url(#sunRaysGrad)"/>
      <polygon points="170,152 115,85 122,87" fill="url(#sunRaysGrad)"/>
    </g>

    <!-- Rising Sun on Horizon -->
    <circle cx="170" cy="150" r="22" fill="#FF9E1B" opacity="0.9"/>
    <circle cx="170" cy="150" r="16" fill="#FFD043"/>

    <!-- Temple Shikhara / Kalasha (Ganjam Sacred Heritage) on Left Shore -->
    <g transform="translate(108, 126)">
      <!-- Temple Spire -->
      <polygon points="14,26 14,-2 10,-2 10,26" fill="#8B3A0F"/>
      <polygon points="12,-10 7,26 17,26" fill="#B84A14"/>
      <!-- Kalasha & Sacred Flag -->
      <circle cx="12" cy="-12" r="2.5" fill="#F3C242"/>
      <path d="M 12 -14 Q 17 -16 20 -13 Q 16 -12 12 -12" fill="#E74C3C"/>
      <!-- Subsidiary Mandapa Steps -->
      <rect x="3" y="20" width="18" height="6" fill="#7E2B08" rx="1"/>
    </g>

    <!-- Coastal Industrial & Port Silhouette (IREL / Chhatrapur Infrastructure) on Right -->
    <g transform="translate(202, 128)">
      <rect x="0" y="8" width="20" height="16" fill="#3D4A54" rx="1"/>
      <rect x="4" y="0" width="3" height="8" fill="#3D4A54"/>
      <rect x="13" y="2" width="3" height="6" fill="#3D4A54"/>
      <!-- Storage tank -->
      <path d="M -10 14 Q -4 10 2 14 L 2 24 L -10 24 Z" fill="#4E5D69"/>
    </g>

    <!-- Bay & Rushikulya River Water -->
    <rect x="70" y="152" width="200" height="120" fill="url(#waterGrad)"/>

    <!-- Gentle Water Reflection Ripples -->
    <path d="M 140 156 Q 170 158 200 156 M 150 160 Q 170 162 190 160 M 130 166 Q 170 170 210 166" stroke="#85C1E9" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>

    <!-- Majestic Ganjam Coastal Rail & Road Arch Bridge -->
    <g transform="translate(65, 142)">
      <!-- Water Reflection of Bridge -->
      <rect x="10" y="22" width="190" height="3" fill="#153A54" opacity="0.5"/>
      <!-- Main Bridge Deck -->
      <rect x="8" y="16" width="194" height="5" fill="#22313F" rx="1"/>
      <rect x="8" y="17" width="194" height="1.5" fill="#E5B23B" opacity="0.7"/>
      <!-- Heavy Stone / Concrete Piers in River -->
      <rect x="42" y="21" width="7" height="20" fill="#1B2631" rx="1"/>
      <rect x="77" y="21" width="7" height="20" fill="#1B2631" rx="1"/>
      <rect x="112" y="21" width="7" height="20" fill="#1B2631" rx="1"/>
      <rect x="147" y="21" width="7" height="20" fill="#1B2631" rx="1"/>
      <!-- Steel Arch Trusses -->
      <path d="M 15 16 Q 45 -4 75 16" fill="none" stroke="#2C3E50" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 75 16 Q 105 -4 135 16" fill="none" stroke="#2C3E50" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 135 16 Q 165 -4 195 16" fill="none" stroke="#2C3E50" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Vertical Suspension Cables -->
      <line x1="30" y1="7" x2="30" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
      <line x1="45" y1="1" x2="45" y2="16" stroke="#2C3E50" stroke-width="1.8"/>
      <line x1="60" y1="7" x2="60" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
      <line x1="90" y1="7" x2="90" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
      <line x1="105" y1="1" x2="105" y2="16" stroke="#2C3E50" stroke-width="1.8"/>
      <line x1="120" y1="7" x2="120" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
      <line x1="150" y1="7" x2="150" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
      <line x1="165" y1="1" x2="165" y2="16" stroke="#2C3E50" stroke-width="1.8"/>
      <line x1="180" y1="7" x2="180" y2="16" stroke="#2C3E50" stroke-width="1.5"/>
    </g>

    <!-- Foreground Coastal Banks with Lush Greenery -->
    <path d="M 70 208 Q 120 188 170 216 Q 220 192 270 214 L 270 270 L 70 270 Z" fill="#196F3D"/>
    <path d="M 70 220 Q 130 200 170 228 Q 210 206 270 226 L 270 270 L 70 270 Z" fill="#145A32" opacity="0.6"/>

    <!-- Coastal Coconut Palm Fronds on Left -->
    <g transform="translate(85, 185)">
      <path d="M 14 30 Q 18 10 28 0" stroke="#5D4037" stroke-width="2.5" fill="none"/>
      <!-- Palm fronds -->
      <path d="M 28 0 Q 36 -6 45 -4" stroke="#27AE60" stroke-width="2" fill="none"/>
      <path d="M 28 0 Q 38 6 42 14" stroke="#229954" stroke-width="2" fill="none"/>
      <path d="M 28 0 Q 20 -8 14 -12" stroke="#27AE60" stroke-width="2" fill="none"/>
      <path d="M 28 0 Q 18 4 12 8" stroke="#1E8449" stroke-width="2" fill="none"/>
      <path d="M 28 0 Q 28 -10 28 -16" stroke="#2ECC71" stroke-width="2" fill="none"/>
    </g>

    <!-- Coastal Foliage Bush Clusters on Right -->
    <circle cx="236" cy="214" r="12" fill="#229954"/>
    <circle cx="248" cy="218" r="14" fill="#1E8449"/>
    <circle cx="224" cy="222" r="10" fill="#145A32"/>
  </g>

  <!-- Golden Laurel Wreath / Garland Base Framing the Medallion -->
  <g fill="url(#nacGold)" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.6))">
    <!-- Left Wreath Leaves -->
    <path d="M 104 220 Q 108 226 114 228 Q 112 221 104 220 Z"/>
    <path d="M 112 232 Q 118 238 126 238 Q 122 231 112 232 Z"/>
    <path d="M 124 242 Q 132 248 142 246 Q 136 240 124 242 Z"/>
