<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic & Scenic Gradients -->
    <linearGradient id="nacGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE77D"/>
      <stop offset="30%" stop-color="#E5B23B"/>
      <stop offset="70%" stop-color="#C89018"/>
      <stop offset="100%" stop-color="#FDE06E"/>
    </linearGradient>

    <linearGradient id="nacGreenBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115228"/>
      <stop offset="50%" stop-color="#0C3C1C"/>
      <stop offset="100%" stop-color="#082A13"/>
    </linearGradient>

    <radialGradient id="innerSkyGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="35%" stop-color="#FEE7A8"/>
      <stop offset="65%" stop-color="#B9E3F5"/>
      <stop offset="100%" stop-color="#4FA3CE"/>
    </radialGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B729E"/>
      <stop offset="40%" stop-color="#1A5276"/>
      <stop offset="100%" stop-color="#0E334D"/>
    </linearGradient>

    <linearGradient id="sunRaysGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAE19" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFAE19" stop-opacity="0"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <clipPath id="nacInnerCircleClip">
      <circle cx="170" cy="170" r="94"/>
    </clipPath>

    <!-- Top Arc Path: left to right, clockwise -->
    <path id="nacTopArc" d="M 46 170 A 124 124 0 0 1 294 170" fill="none"/>
    <!-- Bottom Arc Path: right to left, counter-clockwise (so text reads upright) -->
    <path id="nacBottomArc" d="M 294 170 A 124 124 0 0 1 46 170" fill="none"/>
  </defs>

