    <path d="M 216 242 Q 208 248 198 246 Q 204 240 216 242 Z"/>
    <path d="M 200 249 Q 190 254 180 251 Q 187 246 200 249 Z"/>
    <!-- Central Golden Ribbon Tie -->
    <circle cx="170" cy="253" r="4.5"/>
    <path d="M 166 255 L 160 264 L 168 261 L 170 255 Z"/>
    <path d="M 174 255 L 180 264 L 172 261 L 170 255 Z"/>
  </g>
