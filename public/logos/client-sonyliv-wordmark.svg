<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <!-- White clean background -->
  <rect width="320" height="180" fill="#FFFFFF"/>

  <!-- SONY wordmark (Clean charcoal-black, balanced letter spacing) -->
  <text x="160" y="62" 
        text-anchor="middle" 
        fill="#555555" 
        font-family="'Arial', 'Helvetica Neue', sans-serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="10">
    SONY
  </text>

  <!-- LIV in glowing gradient colors -->
  <!-- L (Purple / Violet) -->
  <text x="105" y="145" 
        text-anchor="middle" 
        fill="#5A2E8A" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="80" 
        font-weight="900" 
        letter-spacing="-1">
    L
  </text>

  <!-- I (Red / Orange) -->
  <text x="145" y="145" 
        text-anchor="middle" 
        fill="#E53935" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="80" 
        font-weight="900" 
        letter-spacing="-1">
    I
  </text>

  <!-- V with subtle multicolored gradient (Yellow / Orange / Pink / Violet) -->
  <defs>
    <linearGradient id="livVGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB8C00"/>
      <stop offset="50%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
  </defs>

  <text x="195" y="145" 
        text-anchor="middle" 
        fill="url(#livVGrad)" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="80" 
        font-weight="900" 
        letter-spacing="-1">
    V
  </text>
</svg>
