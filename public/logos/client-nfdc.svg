<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Transparent / Pure White Canvas with ample horizontal breathing room for N and C -->
  <rect width="540" height="250" fill="#FFFFFF"/>
  
  <!-- NFDC bold typography with balanced padding so N and C are completely uncut -->
  <text x="270" y="145" 
        text-anchor="middle" 
        fill="#1C3F85" 
        font-family="'Arial Black', 'Trebuchet MS', Impact, system-ui, -apple-system, sans-serif" 
        font-size="142" 
        font-weight="900" 
        letter-spacing="-1">
    NFDC
  </text>

  <!-- Dividing line exactly matching the NFDC text width -->
  <line x1="45" y1="172" x2="495" y2="172" stroke="#111111" stroke-width="8" stroke-linecap="square"/>

  <!-- cinemas of india official subtitle -->
  <text x="270" y="218" 
        text-anchor="middle" 
        fill="#111111" 
        font-family="'Courier New', Courier, 'Special Elite', monospace, serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="3.5">
    cinemas of india
  </text>
</svg>
