<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="100%">
  <!-- Director / Cinema Clapperboard Logo as seen in Slot 4 -->
  <rect width="360" height="300" fill="#FFFFFF"/>

  <!-- Clapperboard Body (angled open top) -->
  <g transform="translate(45, 30)">
    <!-- Top hinged clapper stick (tilted slightly upward ~12 deg) -->
    <g transform="rotate(-10 0 50)">
      <rect x="0" y="8" width="260" height="38" fill="#18181B" rx="3"/>
      <!-- Diagonal white chevron stripes -->
      <polygon points="30,8 60,8 35,46 5,46" fill="#FFFFFF"/>
      <polygon points="85,8 115,8 90,46 60,46" fill="#FFFFFF"/>
      <polygon points="140,8 170,8 145,46 115,46" fill="#FFFFFF"/>
      <polygon points="195,8 225,8 200,46 170,46" fill="#FFFFFF"/>
      <!-- Hinge rivet -->
      <circle cx="14" cy="27" r="5" fill="#D4D4D8"/>
    </g>

    <!-- Lower fixed stick with matching reverse diagonal stripes -->
    <rect x="0" y="52" width="260" height="36" fill="#18181B" rx="2"/>
    <polygon points="30,52 60,52 35,88 5,88" fill="#FFFFFF"/>
    <polygon points="85,52 115,52 90,88 60,88" fill="#FFFFFF"/>
    <polygon points="140,52 170,52 145,88 115,88" fill="#FFFFFF"/>
    <polygon points="195,52 225,52 200,88 170,88" fill="#FFFFFF"/>

    <!-- Main Slate Board -->
    <rect x="0" y="90" width="260" height="150" fill="#18181B" rx="3"/>

    <!-- Chalk Slate Grid Lines -->
    <line x1="12" y1="130" x2="248" y2="130" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="172" x2="248" y2="172" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="205" x2="248" y2="205" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    
    <line x1="90" y1="130" x2="90" y2="172" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="175" y1="130" x2="175" y2="172" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

    <!-- Chalk Text: PRODUCTION -->
    <text x="16" y="112" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="10" font-weight="700">PROD.</text>
    <text x="62" y="122" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="15" font-weight="900" letter-spacing="1">CINEMA 4 GOOD INDIA</text>

    <!-- Chalk Text: SCENE / TAKE / ROLL -->
    <text x="16" y="143" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="9" font-weight="700">SCENE</text>
    <text x="45" y="164" text-anchor="middle" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="20" font-weight="900">24</text>

    <text x="96" y="143" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="9" font-weight="700">TAKE</text>
    <text x="132" y="164" text-anchor="middle" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="20" font-weight="900">3</text>

    <text x="182" y="143" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="9" font-weight="700">ROLL</text>
    <text x="212" y="164" text-anchor="middle" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="20" font-weight="900">7</text>

    <!-- Chalk Text: DATE / DIRECTOR / FPS -->
    <text x="16" y="188" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="9" font-weight="700">DATE</text>
    <text x="55" y="188" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12" font-weight="700">13 OCT 2023</text>

    <text x="16" y="222" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="9" font-weight="700">DIRECTOR</text>
    <text x="75" y="222" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12" font-weight="700">A. RAO</text>

    <text x="185" y="234" fill="#D4D4D8" font-family="'Courier New', monospace" font-size="9" font-weight="700">FPS</text>
    <text x="220" y="234" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="16" font-weight="900">24</text>
  </g>
</svg>
