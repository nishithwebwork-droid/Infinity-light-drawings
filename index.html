      // Fix for environments where window.fetch has only a getter without a setter,
      // preventing "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(fn) { currentFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }

          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var orig = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: function() {
                return orig ? orig.apply(window, arguments) : Promise.reject(new Error('fetch unavailable'));
              },
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        }
      })();
    </script>
